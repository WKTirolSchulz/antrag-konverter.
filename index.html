<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Förderanträge Konverter</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8fafc; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .field { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; }
    input[type="file"] { display: block; width: 100%; }
    button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Förderanträge Konverter</h2>
    
    <div class="field">
      <label>1. Word-Vorlage (.docx):</label>
      <input type="file" id="templateInput" accept=".docx" />
    </div>

    <div class="field">
      <label>2. Excel-Daten (.xls / .xlsx):</label>
      <input type="file" id="excelInput" accept=".xlsx, .xls" />
    </div>

    <button id="convertBtn" disabled>Word-Dokument im Original-Design erstellen</button>
  </div>

  <script>
    let templateArrayBuffer = null;
    let excelData = null;

    const convertBtn = document.getElementById('convertBtn');

    function checkReady() {
      convertBtn.disabled = !(templateArrayBuffer && excelData);
    }

    // Word Vorlage einlesen
    document.getElementById('templateInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      templateArrayBuffer = await file.arrayBuffer();
      checkReady();
    });

    // Excel Daten einlesen
    document.getElementById('excelInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer);
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      excelData = XLSX.utils.sheet_to_json(firstSheet);
      checkReady();
    });

    // Konvertierung durchführen
    convertBtn.addEventListener('click', () => {
      if (!templateArrayBuffer || !excelData) return;

      // Excel-Daten für das Template aufbereiten
      const rows = excelData.map((row, index) => {
        const isFreigegeben = String(row["Status"] || "").toLowerCase() === "freigegeben";
        const vertreter = [row["Vorname"], row["Name"]].filter(Boolean).join(" ");

        return {
          nr: index + 1,
          firma: row["Firmenname"] || "",
          vertreter: vertreter,
          branche: row["Branche"] || "",
          aktion: "Digitalisierung",
          betrag: row["Förderung"] || "",
          auftrag: row["Mitgliedsnummer"] || "",
          kur: "",
          einverstaendnis: isFreigegeben ? "ja" : "",
          pos: isFreigegeben ? "X" : "",
          neg: !isFreigegeben ? "X" : "",
          begruendung: ""
        };
      });

      // docxtemplater ausführen
      const zip = new PizZip(templateArrayBuffer);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

      doc.render({ rows: rows });

      const blob = doc.getZip().generate({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      });

      saveAs(blob, "Anträge_Beurteilung_Land_ORIGINAL.docx");
    });
  </script>
</body>
</html>
